<!doctype html>
<meta charset="utf-8">
<title>Pygmalion assembly — fasteners</title>
<style>
  :root{--bg:#12151a;--panel:#1b2027;--line:#2c333d;--fg:#dfe4ea;--dim:#8b95a3;--hi:#ffd166}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font:13px/1.45 ui-sans-serif,system-ui,"Segoe UI",sans-serif}
  #view{position:fixed;inset:0}
  .panel{position:fixed;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:12px 14px}
  #side{top:12px;left:12px;width:262px;max-height:calc(100vh - 24px);overflow:auto}
  #info{bottom:12px;right:12px;width:310px}
  h1{font-size:14px;margin:0 0 2px}
  .sub{color:var(--dim);font-size:11px;margin-bottom:10px}
  .row{display:flex;align-items:center;gap:7px;padding:2px 0;cursor:pointer}
  .row:hover{color:#fff}
  .sw{width:12px;height:12px;border-radius:3px;flex:0 0 12px}
  .cnt{margin-left:auto;color:var(--dim);font-variant-numeric:tabular-nums}
  .kind{font-size:12px}
  hr{border:0;border-top:1px solid var(--line);margin:11px 0}
  label{display:flex;align-items:center;gap:7px;padding:2px 0;color:var(--dim);cursor:pointer}
  label:hover{color:var(--fg)}
  #info h2{font-size:19px;margin:0 0 2px;color:var(--hi);letter-spacing:.3px}
  #info .k{color:var(--dim);display:inline-block;width:74px}
  #info .empty{color:var(--dim)}
  code{background:#0d1014;padding:1px 5px;border-radius:4px;font-size:12px}
  #warn{color:#ffb4a2;font-size:11px;margin-top:8px;display:none}
  .btn{display:inline-block;margin-top:8px;padding:4px 9px;border:1px solid var(--line);
    border-radius:6px;color:var(--dim);cursor:pointer;font-size:11px}
  .btn:hover{color:#fff;border-color:#48505c}
</style>
<div id="view"></div>

<div class="panel" id="side">
  <h1>Fasteners</h1>
  <div class="sub" id="count">…</div>
  <div id="kinds"></div>
  <hr>
  <label><input type="checkbox" id="cbMesh" checked> link meshes</label>
  <label><input type="checkbox" id="cbMirror" checked> mirror the other side</label>
  <label><input type="checkbox" id="cbLabels"> always-on labels</label>
  <div class="btn" id="btnReset">reset view</div>
  <div id="warn"></div>
</div>

<div class="panel" id="info">
  <div class="empty" id="infoEmpty">Click a fastener to read its designation.</div>
  <div id="infoBody" style="display:none">
    <h2 id="iSize"></h2>
    <div id="iHead" style="color:var(--dim);margin-bottom:8px"></div>
    <div><span class="k">standard</span><span id="iStd"></span></div>
    <div><span class="k">grade</span><span id="iGrade"></span></div>
    <div><span class="k">link</span><span id="iBody"></span></div>
    <div><span class="k">mass</span><span id="iMass"></span></div>
    <div><span class="k">CAD mm</span><code id="iCad"></code></div>
    <div><span class="k">same kind</span><span id="iSame"></span></div>
  </div>
</div>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="vendor/STLLoader.js"></script>
<script>
const PALETTE = ['#ffd166','#06d6a0','#ef476f','#118ab2','#f78c6b','#c77dff','#8ac926',
                 '#ff70a6','#4cc9f0','#f9c74f','#90be6d','#f9844a','#577590','#e07a5f',
                 '#81b29a','#bc6c25','#9d4edd'];

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x12151a);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.01, 60);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
document.getElementById('view').appendChild(renderer.domElement);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x333844, 1.05));
const key = new THREE.DirectionalLight(0xffffff, 0.85); key.position.set(1.2,-1.5,2); scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.35); fill.position.set(-1.5,1.2,0.6); scene.add(fill);

// the robot stands with the pelvis at the origin; sim frame is z-up
const HOME = {target:new THREE.Vector3(0,0,-0.15), pos:new THREE.Vector3(1.15,-1.15,0.55)};
function resetView(){ controls.target.copy(HOME.target); camera.position.copy(HOME.pos);
  camera.up.set(0,0,1); controls.update(); }
resetView();
document.getElementById('btnReset').onclick = resetView;

const meshGroup = new THREE.Group(); scene.add(meshGroup);
const screwGroup = new THREE.Group(); scene.add(screwGroup);
const labelGroup = new THREE.Group(); scene.add(labelGroup);

function labelSprite(text, colour){
  const pad = 6, f = 30;
  const c = document.createElement('canvas'), g = c.getContext('2d');
  g.font = `600 ${f}px ui-sans-serif,system-ui,sans-serif`;
  c.width = g.measureText(text).width + pad*2; c.height = f + pad*2;
  const h = c.getContext('2d');
  h.font = `600 ${f}px ui-sans-serif,system-ui,sans-serif`;
  h.fillStyle = 'rgba(10,12,16,.82)';
  h.fillRect(0,0,c.width,c.height);
  h.fillStyle = colour; h.textBaseline='middle';
  h.fillText(text, pad, c.height/2);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({
    map:new THREE.CanvasTexture(c), depthTest:false, transparent:true}));
  s.scale.set(c.width/c.height*0.030, 0.030, 1);
  return s;
}

let DATA=null, kindOf={}, byKind={}, screwMeshes=[], selected=null, hover=null;

fetch('screws.json').then(r=>r.json()).then(d=>{ DATA=d; build(); });

function build(){
  // ---- link meshes -------------------------------------------------------
  const loader = new THREE.STLLoader();
  const mat = new THREE.MeshLambertMaterial({color:0x6e7b8b, transparent:true,
      opacity:0.30, depthWrite:false, side:THREE.DoubleSide});
  DATA.links.forEach(l=>loader.load('meshes/'+l.stl, geo=>{
      const m = new THREE.Mesh(geo, mat);
      m.position.set(l.pos[0], l.pos[1], l.pos[2]);
      meshGroup.add(m);
  }));

  // ---- fasteners ---------------------------------------------------------
  DATA.screws.forEach(s=>{ (byKind[s.size+' '+s.head] ||= []).push(s); });
  const kinds = Object.keys(byKind).sort((a,b)=>byKind[b].length-byKind[a].length);
  kinds.forEach((k,i)=>kindOf[k]=PALETTE[i%PALETTE.length]);

  const sph = new THREE.SphereGeometry(1, 14, 10);
  const cyl = new THREE.CylinderGeometry(1, 1, 1, 14);
  cyl.rotateX(Math.PI/2);                       // cylinder axis -> +z
  cyl.translate(0, 0, -0.5);                    // head at the origin, body going in

  const add = (s, mirrored)=>{
    const k = s.size+' '+s.head;
    const dia = Math.max(parseFloat((s.size.match(/M([\d.]+)/)||[0,3])[1]) || 3, 2);
    const len = parseFloat((s.size.match(/x([\d.]+)/)||[0,10])[1]) || 10;
    const r = dia/2000, L = len/1000;
    let mesh;
    if (s.axis){
      mesh = new THREE.Mesh(cyl, new THREE.MeshLambertMaterial({color:kindOf[k]}));
      mesh.scale.set(r, r, L);
      const a = new THREE.Vector3(s.axis[0], mirrored?-s.axis[1]:s.axis[1], s.axis[2]).normalize();
      mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1), a);
    } else {
      mesh = new THREE.Mesh(sph, new THREE.MeshLambertMaterial({color:kindOf[k]}));
      mesh.scale.setScalar(Math.max(r*1.9, 0.0045));
    }
    mesh.position.set(s.pos[0], mirrored?-s.pos[1]:s.pos[1], s.pos[2]);
    mesh.userData = {s, k, mirrored};
    if (mirrored) mesh.material = mesh.material.clone(), mesh.material.opacity=0.45,
                  mesh.material.transparent=true;
    screwGroup.add(mesh); screwMeshes.push(mesh);
  };
  DATA.screws.forEach(s=>{
    add(s, false);
    if (s.side !== 'C') add(s, true);
  });

  // ---- legend ------------------------------------------------------------
  document.getElementById('count').textContent =
    `${DATA.screws.length} in the CAD · ${screwMeshes.length} shown with the mirror`;
  const box = document.getElementById('kinds');
  kinds.forEach(k=>{
    const row = document.createElement('div'); row.className='row';
    row.innerHTML = `<span class="sw" style="background:${kindOf[k]}"></span>`+
                    `<span class="kind">${k}</span><span class="cnt">${byKind[k].length}</span>`;
    row.onmouseenter = ()=>highlightKind(k);
    row.onmouseleave = ()=>highlightKind(null);
    row.onclick = ()=>pick(byKind[k][0], null);
    box.appendChild(row);
  });
  if (!DATA.oriented){
    const w = document.getElementById('warn');
    w.style.display='block';
    w.textContent = 'Orientation not loaded yet (Fusion was busy) — markers are spheres. '+
                    'Re-run build_data.py once Fusion is free to get real screw axes.';
  }
  refreshLabels();
}

function highlightKind(k){
  screwMeshes.forEach(m=>{
    const on = (k===null) || m.userData.k===k;
    m.material.opacity = on ? (m.userData.mirrored?0.45:1) : 0.08;
    m.material.transparent = true;
  });
}

function refreshLabels(){
  labelGroup.clear();
  if (!document.getElementById('cbLabels').checked) return;
  const done = new Set();
  screwMeshes.forEach(m=>{
    if (m.userData.mirrored) return;
    const k = m.userData.k;
    if (done.has(k)) return;                    // one label per kind, not 283 of them
    done.add(k);
    const sp = labelSprite(m.userData.s.size, kindOf[k]);
    sp.position.copy(m.position).add(new THREE.Vector3(0,0,0.022));
    labelGroup.add(sp);
  });
}

const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
function pointer(e){
  ptr.x = (e.clientX/innerWidth)*2-1; ptr.y = -(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(ptr, camera);
  return ray.intersectObjects(screwMeshes, false)[0];
}
renderer.domElement.addEventListener('pointermove', e=>{
  const hit = pointer(e);
  renderer.domElement.style.cursor = hit ? 'pointer' : 'default';
  if (hover && hover!==selected) hover.scale.multiplyScalar(1/1.6);
  hover = hit ? hit.object : null;
  if (hover && hover!==selected) hover.scale.multiplyScalar(1.6);
});
renderer.domElement.addEventListener('click', e=>{
  const hit = pointer(e);
  if (hit) pick(hit.object.userData.s, hit.object);
});

function pick(s, mesh){
  labelGroup.clear(); refreshLabels();
  selected = mesh;
  document.getElementById('infoEmpty').style.display='none';
  document.getElementById('infoBody').style.display='block';
  const k = s.size+' '+s.head;
  document.getElementById('iSize').textContent = s.size;
  document.getElementById('iHead').textContent = s.head;
  document.getElementById('iStd').textContent = s.std || '—';
  document.getElementById('iGrade').textContent = s.grade || '—';
  document.getElementById('iBody').textContent = s.body;
  document.getElementById('iMass').textContent = s.mass_g.toFixed(2)+' g';
  document.getElementById('iCad').textContent = s.cad_mm.join(', ');
  document.getElementById('iSame').textContent = byKind[k].length+' in this assembly';
  const sp = labelSprite(`${s.size} ${s.head}`, kindOf[k]);
  const base = mesh ? mesh.position : new THREE.Vector3(s.pos[0], s.pos[1], s.pos[2]);
  sp.position.copy(base).add(new THREE.Vector3(0,0,0.03));
  sp.scale.multiplyScalar(1.5);
  labelGroup.add(sp);
  highlightKind(k);
}

document.getElementById('cbMesh').onchange = e=>meshGroup.visible = e.target.checked;
document.getElementById('cbMirror').onchange = e=>screwMeshes.forEach(
  m=>{ if (m.userData.mirrored) m.visible = e.target.checked; });
document.getElementById('cbLabels').onchange = refreshLabels;
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
(function loop(){ requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();
</script>

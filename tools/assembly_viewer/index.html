<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pygmalion assembly — fasteners</title>
<style>
:root{
  --bg:#12151a; --panel:#191e25; --panel2:#1f252e; --line:#2c333d; --fg:#e2e7ee;
  --dim:#8b95a3; --hi:#ffd166; --accent:#4cc9f0;
  --bar:52px; --safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font:13px/1.45 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif}
#view{position:fixed;inset:0;touch-action:none}
button,select,input{font:inherit;color:inherit}

/* ---------- top bar ---------- */
#bar{position:fixed;top:0;left:0;right:0;height:var(--bar);display:flex;align-items:center;
  gap:8px;padding:0 10px;background:rgba(18,21,26,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);z-index:20}
#bar .title{font-weight:600;white-space:nowrap}
#bar .title small{color:var(--dim);font-weight:400;margin-left:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:34px;
  padding:0 11px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);
  cursor:pointer;white-space:nowrap;user-select:none}
.btn:hover{border-color:#48505c}
.btn.on{border-color:var(--accent);color:var(--accent)}
.btn.icon{padding:0;width:38px;font-size:16px}
#views{display:flex;gap:5px}
#search{flex:1;min-width:70px;max-width:260px;height:34px;padding:0 11px;border-radius:8px;
  border:1px solid var(--line);background:var(--panel2)}
#search::placeholder{color:var(--dim)}
#burger{display:none}

/* ---------- side panel ---------- */
#side{position:fixed;top:var(--bar);left:0;bottom:0;width:270px;padding:12px 12px 20px;
  background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;z-index:15;
  overscroll-behavior:contain}
#side.hide{transform:translateX(-100%)}
.sec{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--dim);
  margin:14px 0 6px}
.sec:first-child{margin-top:0}
.row{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;cursor:pointer}
.row:hover{background:var(--panel2)}
.row.on{background:#26303c}
.sw{width:12px;height:12px;border-radius:3px;flex:0 0 12px}
.cnt{margin-left:auto;color:var(--dim);font-variant-numeric:tabular-nums;font-size:12px}
label.row input{width:16px;height:16px;accent-color:var(--accent)}
#chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{padding:4px 9px;border:1px solid var(--line);border-radius:14px;background:var(--panel2);
  cursor:pointer;font-size:12px}
.chip.on{border-color:var(--accent);color:var(--accent)}

/* ---------- info panel ---------- */
#info{position:fixed;right:12px;bottom:12px;width:320px;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;padding:13px 15px;z-index:16}
#info h2{font-size:21px;margin:0 0 1px;color:var(--hi);letter-spacing:.3px}
#info .head{color:var(--dim);margin-bottom:9px}
#info .k{color:var(--dim);display:inline-block;width:78px}
.empty{color:var(--dim)}
code{background:#0d1014;padding:1px 5px;border-radius:4px;font-size:12px}
#nav{display:flex;gap:6px;align-items:center;margin-top:11px}
#nav .pos{color:var(--dim);font-variant-numeric:tabular-nums;margin-left:auto;font-size:12px}
#hint{position:fixed;left:282px;bottom:12px;color:var(--dim);font-size:11px;z-index:14;
  pointer-events:none}
#warn{color:#ffb4a2;font-size:11px;margin-top:10px}

/* ---------- responsive ---------- */
@media (max-width:860px){
  :root{--bar:50px}
  #burger{display:inline-flex}
  #bar .title small{display:none}
  #side{width:82vw;max-width:320px;transition:transform .18s ease;
    box-shadow:0 0 40px #0008}
  #side.hide{transform:translateX(-100%)}
  #scrim{position:fixed;inset:var(--bar) 0 0 0;background:#0009;z-index:14;display:none}
  #scrim.show{display:block}
  #info{left:8px;right:8px;width:auto;bottom:calc(8px + var(--safe));
    border-radius:14px 14px 12px 12px;padding:11px 13px}
  #info h2{font-size:19px}
  #hint{display:none}
  #views .btn{padding:0 9px}
  .btn{min-height:38px}
  .chip{padding:6px 11px}
}
@media (max-width:560px){
  #views{display:none}
  #search{max-width:none}
}
</style>

<div id="view"></div>
<div id="scrim"></div>

<div id="bar">
  <button class="btn icon" id="burger" title="panel">☰</button>
  <div class="title">Fasteners<small id="count"></small></div>
  <input id="search" placeholder="M4x20, countersunk, shin…" autocomplete="off">
  <div id="views">
    <button class="btn" data-v="iso">iso</button>
    <button class="btn" data-v="front">front</button>
    <button class="btn" data-v="side">side</button>
    <button class="btn" data-v="top">top</button>
  </div>
  <button class="btn" id="fit" title="frame what is visible (F)">fit</button>
</div>

<div id="side">
  <div class="sec">designation</div>
  <div id="kinds"></div>
  <div class="sec">link</div>
  <div id="chips"></div>
  <div class="sec">show</div>
  <label class="row"><input type="checkbox" id="cbMesh" checked> link meshes</label>
  <label class="row"><input type="checkbox" id="cbMirror" checked> mirrored side</label>
  <label class="row"><input type="checkbox" id="cbLabels"> label every kind</label>
  <label class="row"><input type="checkbox" id="cbHideOthers"> hide instead of dim</label>
  <div id="warn"></div>
</div>

<div id="info">
  <div class="empty" id="infoEmpty">Tap a fastener to read its designation.</div>
  <div id="infoBody" style="display:none">
    <h2 id="iSize"></h2>
    <div class="head" id="iHead"></div>
    <div><span class="k">standard</span><span id="iStd"></span></div>
    <div><span class="k">grade</span><span id="iGrade"></span></div>
    <div><span class="k">link</span><span id="iBody"></span></div>
    <div><span class="k">mass</span><span id="iMass"></span></div>
    <div><span class="k">goes in</span><span id="iAxis"></span></div>
    <div><span class="k">seat CAD</span><code id="iCad"></code></div>
    <div id="nav">
      <button class="btn" id="prev" title="previous of this kind ([)">◀</button>
      <button class="btn" id="next" title="next of this kind (])">▶</button>
      <button class="btn" id="focus" title="fly to it (F)">focus</button>
      <span class="pos" id="iPos"></span>
    </div>
  </div>
</div>

<div id="hint">drag rotate · right-drag or two-finger pan · wheel zoom · dbl-click focus ·
  keys 1-4 views, F fit/focus, [ ] step, Esc clear</div>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="vendor/STLLoader.js"></script>
<script>
const PALETTE=['#ffd166','#06d6a0','#ef476f','#4cc9f0','#f78c6b','#c77dff','#8ac926',
  '#ff70a6','#57cc99','#f9c74f','#90be6d','#f9844a','#8ecae6','#e07a5f','#81b29a',
  '#bc6c25','#9d4edd'];

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x12151a);
const camera=new THREE.PerspectiveCamera(40,1,0.01,80);
camera.up.set(0,0,1);                                   // the model is z-up
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.getElementById('view').appendChild(renderer.domElement);

const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.09;
controls.screenSpacePanning=true;                       // pan follows the screen, not the ground
controls.minDistance=0.06; controls.maxDistance=6;
controls.rotateSpeed=0.85; controls.zoomSpeed=0.9; controls.panSpeed=0.8;
if(THREE.TOUCH) controls.touches={ONE:THREE.TOUCH.ROTATE,TWO:THREE.TOUCH.DOLLY_PAN};

scene.add(new THREE.HemisphereLight(0xffffff,0x333844,1.05));
const k1=new THREE.DirectionalLight(0xffffff,.85); k1.position.set(1.2,-1.5,2); scene.add(k1);
const k2=new THREE.DirectionalLight(0xffffff,.35); k2.position.set(-1.5,1.2,.6); scene.add(k2);

const meshGroup=new THREE.Group(), screwGroup=new THREE.Group(), labelGroup=new THREE.Group();
[meshGroup,screwGroup,labelGroup].forEach(g=>scene.add(g));

/* ---------- camera moves ------------------------------------------------ */
let tween=null;
function flyTo(pos,target,ms=420){
  tween={t0:performance.now(),ms,p0:camera.position.clone(),t:controls.target.clone(),
         p1:pos.clone(),t1:target.clone()};
}
function stepTween(){
  if(!tween) return;
  const u=Math.min((performance.now()-tween.t0)/tween.ms,1), e=u<.5?2*u*u:1-2*(1-u)*(1-u);
  camera.position.lerpVectors(tween.p0,tween.p1,e);
  controls.target.lerpVectors(tween.t,tween.t1,e);
  if(u>=1) tween=null;
}
const DIRS={iso:new THREE.Vector3(1,-1,.55),front:new THREE.Vector3(1,0,.12),
            side:new THREE.Vector3(0,-1,.12),top:new THREE.Vector3(0,-.001,1)};
function frame(box,dirName){
  if(box.isEmpty()) return;
  const c=box.getCenter(new THREE.Vector3()),
        r=Math.max(box.getSize(new THREE.Vector3()).length()/2,0.05);
  const dist=r/Math.sin(camera.fov*Math.PI/360)*1.15;
  const d=(DIRS[dirName]||camera.position.clone().sub(controls.target)).clone().normalize();
  const pos=c.clone().add(d.clone().multiplyScalar(dist));
  // On desktop the sidebar covers the left 270 px, so centring on the viewport buries the
  // model behind it. Slide the whole framing right by half the panel.
  const pad=(innerWidth>860?270:0)/2;
  if(pad){
    const wpp=2*dist*Math.tan(camera.fov*Math.PI/360)/innerHeight;
    const right=new THREE.Vector3().crossVectors(d,camera.up).normalize()
                  .multiplyScalar(-pad*wpp);
    pos.add(right); c.add(right);
  }
  flyTo(pos,c);
}
function visibleBox(){
  const b=new THREE.Box3();
  screwMeshes.forEach(m=>{ if(m.visible && m.userData.match) b.expandByPoint(m.position); });
  if(b.isEmpty()) meshGroup.children.forEach(m=>b.expandByObject(m));
  b.expandByScalar(0.03);
  return b;
}
document.querySelectorAll('#views .btn').forEach(b=>
  b.onclick=()=>frame(visibleBox(),b.dataset.v));
document.getElementById('fit').onclick=()=>frame(visibleBox(),null);

/* ---------- data -------------------------------------------------------- */
let DATA=null,kindOf={},byKind={},byLink={},screwMeshes=[],selected=null,hover=null;
let kindFilter=null,linkFilter=null,query='',cycle=[],cycleAt=-1;

fetch('screws.json').then(r=>r.json()).then(d=>{DATA=d;build();});

function labelSprite(text,colour,scale=1){
  const pad=7,f=30,c=document.createElement('canvas'),g=c.getContext('2d');
  g.font=`600 ${f}px ui-sans-serif,system-ui,sans-serif`;
  c.width=g.measureText(text).width+pad*2; c.height=f+pad*2;
  const h=c.getContext('2d');
  h.font=`600 ${f}px ui-sans-serif,system-ui,sans-serif`;
  h.fillStyle='rgba(10,12,16,.85)'; h.fillRect(0,0,c.width,c.height);
  h.fillStyle=colour; h.textBaseline='middle'; h.fillText(text,pad,c.height/2);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),
    depthTest:false,transparent:true}));
  s.scale.set(c.width/c.height*0.030*scale,0.030*scale,1);
  return s;
}

function build(){
  const loader=new THREE.STLLoader();
  const mat=new THREE.MeshLambertMaterial({color:0x6e7b8b,transparent:true,opacity:.28,
    depthWrite:false,side:THREE.DoubleSide});
  DATA.links.forEach(l=>loader.load('meshes/'+l.stl,geo=>{
    const m=new THREE.Mesh(geo,mat); m.position.fromArray(l.pos);
    m.userData.link=l.body; meshGroup.add(m);
    if(meshGroup.children.length===DATA.links.length) frame(visibleBox(),'iso');
  }));

  DATA.screws.forEach(s=>{
    const k=s.size+' '+s.head;
    (byKind[k]=byKind[k]||[]).push(s);
    (byLink[s.body]=byLink[s.body]||[]).push(s);
  });
  const kinds=Object.keys(byKind).sort((a,b)=>byKind[b].length-byKind[a].length);
  kinds.forEach((k,i)=>kindOf[k]=PALETTE[i%PALETTE.length]);

  // Each screw is anchored on its BEARING FACE (build_data.py): the head grows along
  // +axis out of the surface, the shank sinks along -axis into the part. Both geometries
  // are unit-sized and span 0..1 in z so a scale is all that is needed.
  const sph=new THREE.SphereGeometry(1,14,10);
  const shankG=new THREE.CylinderGeometry(1,1,1,16);
  shankG.rotateX(Math.PI/2); shankG.translate(0,0,-0.5);
  const capG=new THREE.CylinderGeometry(1,1,1,18);
  capG.rotateX(Math.PI/2); capG.translate(0,0,0.5);
  const cskG=new THREE.CylinderGeometry(1,0.5,1,18);     // countersunk: a taper into the part
  cskG.rotateX(Math.PI/2); cskG.translate(0,0,0.5);

  const add=(s,mir)=>{
    const k=s.size+' '+s.head;
    const dia=parseFloat((s.size.match(/M([\d.]+)/)||[0,3])[1])||3;
    const len=parseFloat((s.size.match(/x([\d.]+)/)||[0,10])[1])||10;
    const r=dia/2000,L=len/1000;
    const g=new THREE.Group();
    const col=new THREE.Color(kindOf[k]);
    const mtl=new THREE.MeshLambertMaterial({color:col});
    if(s.axis){
      const shank=new THREE.Mesh(shankG,mtl); shank.scale.set(r,r,L); g.add(shank);
      const csk=s.head==='countersunk';
      const head=new THREE.Mesh(csk?cskG:capG,mtl);
      const hr=r*(csk?1.85:1.55), hh=r*(csk?1.15:1.6);
      head.scale.set(hr,hr,hh);
      if(csk) head.rotation.y=Math.PI;                    // taper widest at the surface
      g.add(head);
      const a=new THREE.Vector3(s.axis[0],mir?-s.axis[1]:s.axis[1],s.axis[2]).normalize();
      g.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),a);
    }else{
      const b=new THREE.Mesh(sph,mtl); b.scale.setScalar(Math.max(r*1.9,.0045)); g.add(b);
    }
    g.position.set(s.pos[0],mir?-s.pos[1]:s.pos[1],s.pos[2]);
    g.userData={s,k,mir,mtl,match:true,base:col};
    if(mir){mtl.transparent=true;mtl.opacity=.45;}
    screwGroup.add(g); screwMeshes.push(g);
  };
  DATA.screws.forEach(s=>{add(s,false); if(s.side!=='C') add(s,true);});

  document.getElementById('count').textContent=
    ` — ${DATA.screws.length} in the CAD, ${Object.keys(byKind).length} kinds`;

  const box=document.getElementById('kinds');
  kinds.forEach(k=>{
    const row=document.createElement('div'); row.className='row'; row.dataset.k=k;
    row.innerHTML=`<span class="sw" style="background:${kindOf[k]}"></span>`+
                  `<span>${k}</span><span class="cnt">${byKind[k].length}</span>`;
    row.onclick=()=>{kindFilter=(kindFilter===k)?null:k; sync(true);};
    box.appendChild(row);
  });
  const chips=document.getElementById('chips');
  Object.keys(byLink).sort((a,b)=>byLink[b].length-byLink[a].length).forEach(L=>{
    const c=document.createElement('div'); c.className='chip'; c.dataset.l=L;
    c.textContent=`${L} ${byLink[L].length}`;
    c.onclick=()=>{linkFilter=(linkFilter===L)?null:L; sync(true);};
    chips.appendChild(c);
  });
  if(!DATA.oriented) document.getElementById('warn').textContent=
    'No orientation loaded — markers are spheres. Re-run build_data.py once Fusion is reachable.';
  sync(false);
}

/* ---------- filtering --------------------------------------------------- */
function matches(s){
  if(kindFilter && s.size+' '+s.head!==kindFilter) return false;
  if(linkFilter && s.body!==linkFilter) return false;
  if(query){
    const hay=`${s.size} ${s.head} ${s.std} ${s.body} ${s.grade}`.toLowerCase();
    if(!hay.includes(query)) return false;
  }
  return true;
}
function sync(refit){
  const hide=document.getElementById('cbHideOthers').checked;
  const mir=document.getElementById('cbMirror').checked;
  let n=0;
  screwMeshes.forEach(g=>{
    const ok=matches(g.userData.s);
    g.userData.match=ok;
    if(ok && !g.userData.mir) n++;
    g.visible=(!g.userData.mir||mir) && (ok||!hide);
    const m=g.userData.mtl;
    m.transparent=true;
    m.opacity=ok?(g.userData.mir?.45:1):.07;
    m.depthWrite=ok;
  });
  document.querySelectorAll('#kinds .row').forEach(r=>
    r.classList.toggle('on',r.dataset.k===kindFilter));
  document.querySelectorAll('.chip').forEach(c=>
    c.classList.toggle('on',c.dataset.l===linkFilter));
  cycle=screwMeshes.filter(g=>g.userData.match && !g.userData.mir);
  cycleAt=selected?cycle.indexOf(selected):-1;
  document.getElementById('count').textContent=
    ` — ${n} of ${DATA.screws.length} shown`;
  refreshLabels();
  if(refit) frame(visibleBox(),null);
}
['cbMirror','cbHideOthers'].forEach(id=>
  document.getElementById(id).onchange=()=>sync(false));
document.getElementById('cbMesh').onchange=e=>meshGroup.visible=e.target.checked;
document.getElementById('cbLabels').onchange=refreshLabels;
const search=document.getElementById('search');
search.oninput=()=>{query=search.value.trim().toLowerCase(); sync(false);};
search.onkeydown=e=>{ if(e.key==='Enter'){frame(visibleBox(),null); search.blur();}
                     if(e.key==='Escape'){search.value='';query='';sync(false);search.blur();} };

function clearGroup(g){ while(g.children.length) g.remove(g.children[0]); }
function refreshLabels(){
  clearGroup(labelGroup);
  if(document.getElementById('cbLabels').checked){
    const done=new Set();
    screwMeshes.forEach(g=>{
      if(g.userData.mir||!g.userData.match||done.has(g.userData.k)) return;
      done.add(g.userData.k);
      const sp=labelSprite(g.userData.s.size,kindOf[g.userData.k]);
      sp.position.copy(g.position).add(new THREE.Vector3(0,0,.022));
      labelGroup.add(sp);
    });
  }
  if(selected){
    const s=selected.userData.s;
    const sp=labelSprite(`${s.size} ${s.head}`,kindOf[selected.userData.k],1.5);
    sp.position.copy(selected.position).add(new THREE.Vector3(0,0,.032));
    labelGroup.add(sp);
  }
}

/* ---------- picking ----------------------------------------------------- */
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();
function pickAt(x,y,slack){
  ptr.set((x/innerWidth)*2-1,-(y/innerHeight)*2+1);
  ray.setFromCamera(ptr,camera);
  const hit=ray.intersectObjects(screwMeshes.filter(g=>g.visible&&g.userData.match),true)[0];
  if(hit){ let o=hit.object; while(o.parent&&o.parent!==screwGroup) o=o.parent; return o; }
  // fingers are wider than a 4 mm screw: fall back to the nearest one on screen
  let best=null,bd=slack*slack;
  const v=new THREE.Vector3();
  screwMeshes.forEach(g=>{
    if(!g.visible||!g.userData.match) return;
    v.copy(g.position).project(camera);
    if(v.z>1) return;
    const dx=(v.x*0.5+0.5)*innerWidth-x, dy=(-v.y*0.5+0.5)*innerHeight-y;
    const d=dx*dx+dy*dy;
    if(d<bd){bd=d;best=g;}
  });
  return best;
}
let isTouch=false;
renderer.domElement.addEventListener('pointerdown',e=>isTouch=(e.pointerType==='touch'));
renderer.domElement.addEventListener('pointermove',e=>{
  if(e.pointerType==='touch') return;
  const g=pickAt(e.clientX,e.clientY,14);
  renderer.domElement.style.cursor=g?'pointer':'default';
  if(hover&&hover!==selected) hover.scale.setScalar(1);
  hover=g; if(g&&g!==selected) g.scale.setScalar(1.5);
});
let downAt=null;
renderer.domElement.addEventListener('pointerdown',e=>downAt={x:e.clientX,y:e.clientY,t:Date.now()});
renderer.domElement.addEventListener('pointerup',e=>{
  if(!downAt) return;
  const moved=Math.hypot(e.clientX-downAt.x,e.clientY-downAt.y);
  const quick=Date.now()-downAt.t<400;
  downAt=null;
  if(moved>6||!quick) return;                 // a drag is navigation, not a tap
  const g=pickAt(e.clientX,e.clientY,isTouch?34:16);
  if(g) select(g); else clearSel();
});
renderer.domElement.addEventListener('dblclick',e=>{
  const g=pickAt(e.clientX,e.clientY,20);
  if(g){select(g); focusOn(g);}
});

function focusOn(g){
  const d=camera.position.clone().sub(controls.target).normalize();
  flyTo(g.position.clone().add(d.multiplyScalar(0.16)),g.position.clone());
}
function clearSel(){
  if(selected) selected.scale.setScalar(1);
  selected=null; cycleAt=-1;
  document.getElementById('infoEmpty').style.display='block';
  document.getElementById('infoBody').style.display='none';
  refreshLabels();
}
function select(g){
  if(selected) selected.scale.setScalar(1);
  selected=g; g.scale.setScalar(1.5);
  cycleAt=cycle.indexOf(g);
  const s=g.userData.s,k=g.userData.k;
  // the shank sinks along -axis, so that is the direction the driver pushes
  const A=['forward (+x)','left (+y)','up (+z)'], N=['back (-x)','right (-y)','down (-z)'];
  let dirTxt='—';
  if(s.axis){
    const ax=s.axis.map((v,j)=>g.userData.mir&&j===1?-v:v);
    const i=[0,1,2].reduce((b,j)=>Math.abs(ax[j])>Math.abs(ax[b])?j:b,0);
    dirTxt=(-ax[i]>0?A[i]:N[i])+'  · head faces '+(ax[i]>0?A[i]:N[i]);
  }
  document.getElementById('infoEmpty').style.display='none';
  document.getElementById('infoBody').style.display='block';
  document.getElementById('iSize').textContent=s.size;
  document.getElementById('iHead').textContent=s.head+(g.userData.mir?'  · mirrored side':'');
  document.getElementById('iStd').textContent=s.std||'—';
  document.getElementById('iGrade').textContent=s.grade||'—';
  document.getElementById('iBody').textContent=s.body;
  document.getElementById('iMass').textContent=s.mass_g.toFixed(2)+' g';
  document.getElementById('iAxis').textContent=dirTxt;
  document.getElementById('iCad').textContent=s.cad_mm.join(', ');
  document.getElementById('iPos').textContent=
    `${cycleAt+1} / ${cycle.length}${kindFilter||linkFilter||query?' shown':' of '+byKind[k].length+' '+k}`;
  refreshLabels();
}
function step(d){
  if(!cycle.length) return;
  cycleAt=(cycleAt+d+cycle.length)%cycle.length;
  select(cycle[cycleAt]); focusOn(cycle[cycleAt]);
}
document.getElementById('prev').onclick=()=>step(-1);
document.getElementById('next').onclick=()=>step(1);
document.getElementById('focus').onclick=()=>selected&&focusOn(selected);

/* ---------- keyboard, drawer, resize ------------------------------------ */
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'){ return; }
  const map={'1':'iso','2':'front','3':'side','4':'top'};
  if(map[e.key]) frame(visibleBox(),map[e.key]);
  else if(e.key==='f'||e.key==='F') selected?focusOn(selected):frame(visibleBox(),null);
  else if(e.key==='[') step(-1);
  else if(e.key===']') step(1);
  else if(e.key==='Escape'){kindFilter=linkFilter=null;query='';search.value='';clearSel();sync(false);}
  else if(e.key==='/'){e.preventDefault();search.focus();}
});
const side=document.getElementById('side'),scrim=document.getElementById('scrim');
function drawer(open){ side.classList.toggle('hide',!open); scrim.classList.toggle('show',open); }
document.getElementById('burger').onclick=()=>drawer(side.classList.contains('hide'));
scrim.onclick=()=>drawer(false);
function layout(){
  const mobile=innerWidth<=860;
  if(mobile) drawer(false); else {side.classList.remove('hide'); scrim.classList.remove('show');}
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
}
addEventListener('resize',layout); addEventListener('orientationchange',layout); layout();

(function loop(){requestAnimationFrame(loop); stepTween(); controls.update();
  renderer.render(scene,camera);})();
</script>

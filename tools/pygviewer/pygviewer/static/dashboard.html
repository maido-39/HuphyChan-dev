<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>pygviewer dashboard</title>
<link rel="icon" href="data:,"> <!-- silence the /favicon.ico 404 - no real icon needed -->

<link rel="stylesheet" href="/static/vendor/uPlot.min.css">
<style>
/* Gains tab: plain numeric fields, no spinner arrows (user 2026-09-04) */
input.gkp, input.gkd { -moz-appearance: textfield; appearance: textfield; }
input.gkp::-webkit-outer-spin-button, input.gkp::-webkit-inner-spin-button,
input.gkd::-webkit-outer-spin-button, input.gkd::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

:root{
  --bg:#141414; --panel:#181818; --panel2:#1e1e1e; --border:#333; --border2:#444;
  --text:#ddd; --dim:#999; --dim2:#777; --accent:#4a7; --accent2:#fc6; --bad:#e55;
  --blueL:#5b9bd5; --orangeR:#e08a3c; --blueL-lite:#5b9bd577; --orangeR-lite:#e08a3c77;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:13px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif}
button,select,input{font:inherit;color:var(--text);background:#222;border:1px solid var(--border2);
  border-radius:4px;padding:3px 6px}
button{cursor:pointer}
button:hover{background:#2a2a2a}
button.primary{background:#2d5a3d;border-color:#3a7a4d}
button.primary:hover{background:#356b48}
button:disabled{opacity:.4;cursor:not-allowed}
input[type=range]{padding:0}
a{color:var(--blueL)}
h3{margin:.2em 0 .4em;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--dim)}
/* Resizable panes (2026-09-05, docs/121 section 14): the three widths/heights that used to
   be hard 250px/340px/320px literals are now CSS custom properties so a drag handle can
   change them live via element.style.setProperty on .wrap - see dashboard.js's
   initPaneResize(). Two extra thin grid tracks (7px, "divider-left"/"divider-right") carry
   the vertical drag handles between left|scene|right; a third ("divider-bottom") carries the
   horizontal handle between the scene/tabs row and the plots row below. The defaults here
   (250/340/320) are what a first-ever load with nothing in localStorage falls back to. */
.wrap{display:grid;
  --col-left:250px; --col-right:340px; --row-plots:320px;
  grid-template-columns:var(--col-left) 7px 1fr 7px var(--col-right);
  grid-template-rows:38px 1fr 7px var(--row-plots);
  height:100vh;background:var(--border)}
.top{grid-column:1/6;grid-row:1;background:#101010;display:flex;align-items:center;gap:10px;padding:0 12px;
  overflow-x:auto;white-space:nowrap;border-bottom:1px solid var(--border)}

/* drag handles: plain background bars, brighten on hover/while dragging so they read as
   "grabbable" (user ask: "잡기 쉬운 폭(6~8px)에 마우스를 올리면 커서가 바뀌고 색이 살짝
   밝아질 것"). Double-click folds/unfolds the pane on the near side (dashboard.js). */
.divider{background:var(--border);position:relative;z-index:5}
.divider:hover,.divider.dragging{background:var(--border2)}
.divider-v{grid-row:2/5;cursor:col-resize}
#divider-left{grid-column:2;grid-row:2}
#divider-right{grid-column:4}
#divider-bottom{grid-column:1/4;grid-row:3;cursor:row-resize}
/* while a drag is in progress: lock the cursor shape everywhere (not just over the handle,
   since the pointer runs ahead of a fast drag) and kill text selection so dragging across
   labels/plots doesn't highlight them (user ask: "드래그 중에는 텍스트 선택이 되지 않게"). */
body.resizing-v,body.resizing-v *{cursor:col-resize!important}
body.resizing-h,body.resizing-h *{cursor:row-resize!important}
body.resizing-v,body.resizing-h{user-select:none}
.top b.logo{font-size:14px}
.pill{background:#2a2a2a;border-radius:10px;padding:2px 9px;font-size:11px;white-space:nowrap}
.pill.warn{background:#4a3a12;color:var(--accent2)}
.pill.bad{background:#4a1414;color:var(--bad)}
.pill.ok{background:#173a22;color:var(--accent)}
.rates{margin-left:auto;font-size:11px;color:var(--dim);white-space:nowrap}

.left{grid-column:1;grid-row:2;min-width:0;min-height:0;background:var(--panel);display:flex;flex-direction:column;overflow:hidden}
.tabs-v{display:flex;flex-direction:column;border-bottom:1px solid var(--border)}
.tabs-v .tab{padding:9px 12px;border-bottom:1px solid var(--border);color:var(--dim);cursor:pointer;font-size:12px}
.tabs-v .tab.on{background:#262626;color:#fff;font-weight:600;border-left:3px solid var(--accent)}
.tabs-v .tab:hover{background:#202020}
.leftbody{padding:10px;overflow:auto;flex:1}

.scene{grid-column:3;grid-row:2;min-width:0;min-height:0;background:#20242a;position:relative;overflow:hidden}
.scene iframe{width:100%;height:100%;border:0;background:#20242a}
.scene .badge-tr{position:absolute;right:8px;top:8px;font-size:11px;color:var(--dim)}

.right{grid-column:5;grid-row:2/5;min-width:0;min-height:0;background:var(--panel);display:flex;flex-direction:column;overflow:hidden}
.tabs-h{display:flex;border-bottom:1px solid var(--border)}
.tabs-h .tab{flex:1;text-align:center;padding:8px 4px;color:var(--dim);cursor:pointer;font-size:12px}
.tabs-h .tab.on{background:#262626;color:#fff;font-weight:600;border-bottom:2px solid var(--accent)}
.rightbody{padding:10px;overflow:auto;flex:1}

.plots{grid-column:1/4;grid-row:4;min-width:0;min-height:0;background:#101010;padding:6px;overflow:auto}
.plots-toolbar{display:flex;align-items:center;gap:10px;padding:2px 4px 6px;font-size:11px;color:var(--dim)}
.plots-toolbar .seg span{cursor:pointer}
.plots-row{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-bottom:5px}
/* A5 (2026-09-04): grown from 118px -> 144px - not for a legend (the compact grid's legend is
   the hand-rolled `.row-legend` in the row HEADER below, deliberately outside this
   fixed-height/overflow:hidden box so it can never be clipped or steal canvas height from an
   uPlot-internal legend sized against an already-measured container) - just more room for the
   real trace itself to be easier to pick out. */
.plot-cell{background:#1b1b1b;border:1px solid var(--border);border-radius:3px;position:relative;cursor:zoom-in;height:144px;overflow:hidden}
.plot-cell .pt{position:absolute;left:4px;top:2px;font-size:10px;color:var(--dim);pointer-events:none;z-index:2}
/* A5: always-on "sim X / real Y (n=N)" readout - numeric fallback for when the real trace
   itself is hard to pick out ("선이 안 보여도 숫자로 확인 가능하게"). Truncates with an
   ellipsis rather than wrapping/overflowing the tiny cell. */
.plot-cell .pv{position:absolute;right:4px;top:2px;font-size:9px;color:var(--dim);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:74%;pointer-events:none;z-index:2;text-align:right}
.plot-cell .u-wrap{width:100%;height:100%}
/* A5: the per-ROW hand-rolled legend (buildPlotGrid's row header + legendSwatchHtml) - a line
   SAMPLE (this series' actual color/width/dash, via border-top) followed by its label, per
   user feedback round 2 ("legend는 실제 예시선 뒤에 그게 무슨 label이다 달으라고"), not a
   plain color dot. Always visible (it is not inside any panel, so never toggled/clipped). */
.plots-row-hdr{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px}
.row-legend{display:inline-flex;flex-wrap:wrap;gap:2px 10px}
.legend-item{display:inline-flex;align-items:center;gap:4px;color:var(--text)}
.legend-swatch{display:inline-block;width:20px;height:0}
/* A5: the modal's OWN uPlot-native legend (openModal passes {legend:true}; the compact grid
   does not, see makeUplot) - override its default color-DOT marker into a short LINE sample,
   same ask as above but for uPlot's own legend markup (`.u-marker`, uPlot.min.css). Cannot
   reproduce a dash pattern here (uPlot only ever gives it a solid background-color square to
   restyle) - the always-visible hand-rolled `.row-legend` above is what carries the exact
   dash/solid distinction; this is a "good enough for an on-demand detail view" line tint. */
#modal .u-legend{font-size:11px}
.u-legend .u-marker{width:16px !important;height:3px !important;border-radius:0 !important}

.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;
  border-bottom:1px dashed var(--border);font-size:12px}
.row label{color:var(--dim)}
.row.tight{padding:2px 0}
.seg{display:inline-flex;border:1px solid var(--border2);border-radius:5px;overflow:hidden}
.seg span{padding:2px 8px;font-size:11px;cursor:pointer;user-select:none}
.seg span.on{background:var(--accent);color:#000}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px}
.small{font-size:11px;color:var(--dim)}
.warnbanner{background:#4a1414;color:#f88;padding:6px 8px;border-radius:4px;font-size:11px;margin-bottom:8px}
.okbanner{background:#173a22;color:var(--accent);padding:6px 8px;border-radius:4px;font-size:11px;margin-bottom:8px}
.hr{border:0;border-top:1px solid var(--border);margin:8px 0}

/* A2 (2026-09-04): ROM/torque violation red panel - a fixed overlay so it never needs its
   own row in the .wrap grid (every other tab's layout stays untouched).
   FIX (2026-09-05, docs/121 section 14): a headless screenshot caught this panel spanning
   `left:8px;right:8px` - the full window width - which sat directly on top of the right
   control pane (sliders/number inputs unreachable while a live motor was armed). left/right
   are now pinned to the SAME --col-left/--col-right custom properties the resizable grid
   uses (inherited from .wrap, since this element is one of its children), so the panel is
   always confined to the middle (3D scene) column and can never cover the left tab strip or
   the right control pane, at any pane width the user drags to. */
#violation-badge{background:#5a1414;color:#f88;border:1px solid #a33;animation:violation-pulse 1.4s ease-in-out infinite}
@keyframes violation-pulse{0%,100%{opacity:1}50%{opacity:.55}}
.violation-panel{display:none;position:fixed;top:42px;
  left:calc(var(--col-left) + 14px);right:calc(var(--col-right) + 14px);
  max-height:52vh;overflow:auto;
  background:#210d0d;border:1px solid var(--bad);border-radius:6px;padding:10px;z-index:80;
  box-shadow:0 6px 20px #000c}
.violation-panel.on{display:block}
.violation-panel table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:10px}
.violation-panel th{text-align:left;color:var(--dim);padding:3px 6px;border-bottom:1px solid #533}
.violation-panel td{padding:3px 6px;border-bottom:1px dashed #422}
.violation-panel tbody tr[data-joint]:hover{background:#341515;cursor:pointer}

/* A5 (2026-09-04): always-visible operator console strip - user feedback "console log
   같은거에서 띄우던지" (put it up somewhere like a console log). Deliberately NOT part of the
   .wrap grid (same reasoning as .violation-panel above) so no existing tab's layout has to
   change; floats bottom-right, collapsible to just its header bar. Streams both violation
   lines and caught render errors (A6) - see dashboard.js's renderOpConsole.
   FIX (2026-09-05, docs/121 section 14): this - not #violation-panel - turned out to be the
   element an earlier headless screenshot of this same session caught fully covering the
   right control pane's sliders: its width was a flat 460px, WIDER than the control pane's
   own default 340px (and, now that the pane is resizable, wider still than its 300px
   minimum), so it spilled left past the pane's own edge into the 3D scene column instead of
   staying "docked" to the pane whose data it is reporting on. `width` is now capped to the
   right pane's own current width (`--col-right`, minus a small margin) so the console can
   still cover part of ITS OWN column when open with a lot of content (unavoidable - a
   log needs to sit somewhere) but can never again spill past that column's left edge into
   the scene or the left tab strip. */
.op-console{position:fixed;right:8px;bottom:8px;width:min(460px, calc(var(--col-right) - 16px));max-width:44vw;
  background:#150d0d;border:1px solid var(--bad);border-radius:6px;z-index:70;
  box-shadow:0 6px 20px #000c;display:flex;flex-direction:column}
.op-console-hdr{display:flex;align-items:center;gap:6px;padding:5px 8px;font-size:11px;
  color:#f88;white-space:nowrap;overflow:hidden}
.op-console-hdr b{flex:none}
.op-console-hdr .small{overflow:hidden;text-overflow:ellipsis}
.op-console-hdr .spacer{flex:1}
.op-console-hdr button{font-size:10px;padding:2px 6px;flex:none}
.op-console:not(.collapsed) .op-console-hdr{border-bottom:1px solid #422}
.op-console.collapsed #op-console-body{display:none}
#op-console-body{margin:0;padding:6px 8px;font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:10px;line-height:1.5;color:#e8b8b8;max-height:200px;overflow:auto;white-space:pre-wrap;
  word-break:break-word}

/* Motor health (2026-09-04): a status LIGHT, deliberately unlike the violation panel's red
   warning-banner look (green/yellow/grey, no pulsing red, no click-to-open overlay). */
.led{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:2px;vertical-align:middle}
.led-none{background:#555}
.led-ok{background:var(--accent);box-shadow:0 0 4px var(--accent)}
.led-dead{background:var(--bad)}
.heartbeat-dot{display:inline-block;width:5px;height:5px;border-radius:50%;margin-right:4px;vertical-align:middle;background:#333}
.heartbeat-dot.heartbeat-on{background:var(--accent2)}
.health-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:4px 0}
.health-cell{padding:4px 2px;text-align:center;border-radius:3px;font-size:10px;font-family:ui-monospace,Menlo,Consolas,monospace;
  background:#222;border:1px solid var(--border2);cursor:default}
.health-ok{background:#173a22;border-color:#2a5a38;color:var(--accent)}
.health-warn{background:#4a3a12;border-color:#6a5620;color:var(--accent2)}
.health-dead{background:#4a1414;border-color:#6a2222;color:#f88}
.health-fault{background:#5a0e0e;border-color:#ff3b3b;color:#ffd9d9;font-weight:bold}

/* Joints tab */
.joint-row{display:grid;grid-template-columns:88px 1fr 62px 52px 20px;align-items:center;gap:6px;padding:3px 0}
.joint-row input[type=range]{width:100%}
.joint-row .num{width:100%}
.joint-row .name{font-size:11px}
.joint-row .phys{font-size:10px;color:var(--dim)}
/* A joint whose command cannot reach the motor right now (hwHoldState): visibly greyed, and
   the row still takes pointer events so clicking it can explain why. */
.joint-row.hw-held{opacity:.45}
.joint-row.hw-held input[type=range],.joint-row.hw-held .num{cursor:not-allowed}
.tx-cb{transform:scale(.85)}

/* Obs tab */
.obsterm{margin:6px 0}
.obsterm .lbl{font-size:11px;color:var(--dim);display:flex;justify-content:space-between}
.obsbars{display:flex;gap:2px;height:34px;align-items:flex-end;background:#101010;padding:2px;border-radius:3px}
.obsbars i{flex:1;display:block;min-width:2px;background:var(--accent);border-radius:1px 1px 0 0}
.obsbars i.real{background:var(--orangeR)}
.obsbars i.fallback{background:var(--bad)}
#imu3d{width:100%;height:200px;background:#101010;border-radius:4px;margin-top:6px}
.imu-legend{font-size:10px;color:var(--dim);margin-top:2px}

/* Gains tab */
table.gains{width:100%;border-collapse:collapse;font-size:11px}
table.gains th,table.gains td{padding:3px 4px;border-bottom:1px solid var(--border);text-align:right}
table.gains th:first-child,table.gains td:first-child{text-align:left}
table.gains input{width:56px;text-align:right}
.flag{color:var(--bad);font-weight:600}

/* modal */
#modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:50}
#modal.on{display:flex}
#modal .box{background:#181818;border:1px solid var(--border2);border-radius:6px;width:80vw;height:70vh;
  display:flex;flex-direction:column;padding:10px}
#modal .u-wrap{flex:1}
#modal .hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top" id="topbar">
    <b class="logo">pygviewer</b>
    <span class="pill" id="pill-variant">-</span>
    <span class="pill" id="pill-mode">-</span>
    <span class="pill" id="pill-base">-</span>
    <span class="pill" id="pill-control">-</span>
    <span id="topbar-badges"></span>
    <span class="rates" id="topbar-health"></span>
    <span class="rates" id="topbar-rates"></span>
  </div>
  <div class="violation-panel" id="violation-panel"></div>
  <div class="op-console" id="op-console">
    <div class="op-console-hdr">
      <b>&#9888; console</b>
      <span class="small" id="op-console-count"></span>
      <span class="spacer"></span>
      <button id="op-console-autoscroll">autoscroll: on</button>
      <button id="op-console-copy">copy</button>
      <button id="op-console-clear">clear</button>
      <button id="op-console-toggle">collapse</button>
    </div>
    <pre id="op-console-body"></pre>
  </div>

  <div class="left">
    <div class="tabs-v" id="left-tabs">
      <div class="tab on" data-tab="model">Model</div>
      <div class="tab" data-tab="base">Base link</div>
      <div class="tab" data-tab="telemetry">Telemetry / Record</div>
      <div class="tab" data-tab="script">Script</div>
      <div class="tab" data-tab="status">Status</div>
    </div>
    <div class="leftbody" id="left-body"></div>
  </div>

  <div class="divider divider-v" id="divider-left" title="drag to resize - double-click to hide/show the left panel"></div>

  <div class="scene">
    <iframe id="viser-frame" src="about:blank" title="viser 3D scene"></iframe>
    <div class="badge-tr" id="scene-badge"></div>
  </div>

  <div class="divider divider-v" id="divider-right" title="drag to resize - double-click to hide/show the control panel"></div>

  <div class="right">
    <div class="tabs-h" id="right-tabs">
      <div class="tab on" data-tab="control">Control</div>
      <div class="tab" data-tab="gains">Gains</div>
      <div class="tab" data-tab="obs">Obs</div>
    </div>
    <div class="rightbody" id="right-body"></div>
  </div>

  <div class="divider divider-h" id="divider-bottom" title="drag to resize - double-click to hide/show the plots panel"></div>

  <div class="plots" id="plots-panel">
    <div class="plots-toolbar" id="plots-toolbar"></div>
    <div id="plots-rows"></div>
  </div>
</div>

<div id="modal"><div class="box">
  <div class="hdr"><b id="modal-title">-</b><button id="modal-close">close</button></div>
  <div class="u-wrap" id="modal-chart"></div>
</div></div>

<script src="/static/vendor/uPlot.iife.min.js"></script>
<script>
/* Headless verification mode (2026-09-04, docs/121 section 10c): `?no3d=1` or `?headless=1`
 * skips the WebGL-heavy pieces (three.min.js + the viser iframe dashboard.js sets up in
 * boot()) so a headless browser without a real GPU/WebGL context (obscura 0.2.1 on this host
 * - crashes hard, "dumped core", on the plain 3D scene with no error text to act on) can load
 * and drive the rest of the dashboard for automated checks. Never the default: with no query
 * param this is byte-for-byte the same load as before. three.min.js is loaded via an inserted
 * <script> tag rather than a static one so headless mode skips the network fetch entirely,
 * not just its result - dashboard.js only ever touches the `THREE` global from inside
 * functions invoked well after page load (opening the Obs tab), never at parse time, so the
 * normal (non-headless) load order here is not race-sensitive. */
window.PYG_HEADLESS = /[?&](no3d|headless)(=|&|$)/.test(location.search);
if (!window.PYG_HEADLESS) {
  var pygThreeScript = document.createElement("script");
  pygThreeScript.src = "/static/vendor/three.min.js";
  document.currentScript.parentNode.insertBefore(pygThreeScript, document.currentScript.nextSibling);
}
</script>
<script src="/static/dashboard.js"></script>
</body>
</html>

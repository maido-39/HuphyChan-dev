<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>pygviewer dashboard</title>
<link rel="stylesheet" href="/static/vendor/uPlot.min.css">
<style>
/* Gains tab: plain numeric fields, no spinner arrows (user 2026-09-04) */
input.gkp, input.gkd { -moz-appearance: textfield; appearance: textfield; }
input.gkp::-webkit-outer-spin-button, input.gkp::-webkit-inner-spin-button,
input.gkd::-webkit-outer-spin-button, input.gkd::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

:root{
  --bg:#141414; --panel:#181818; --panel2:#1e1e1e; --border:#333; --border2:#444;
  --text:#ddd; --dim:#999; --dim2:#777; --accent:#4a7; --accent2:#fc6; --bad:#e55;
  --blueL:#5b9bd5; --orangeR:#e08a3c; --blueL-lite:#5b9bd577; --orangeR-lite:#e08a3c77;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:13px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif}
button,select,input{font:inherit;color:var(--text);background:#222;border:1px solid var(--border2);
  border-radius:4px;padding:3px 6px}
button{cursor:pointer}
button:hover{background:#2a2a2a}
button.primary{background:#2d5a3d;border-color:#3a7a4d}
button.primary:hover{background:#356b48}
button:disabled{opacity:.4;cursor:not-allowed}
input[type=range]{padding:0}
a{color:var(--blueL)}
h3{margin:.2em 0 .4em;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--dim)}
.wrap{display:grid;grid-template-columns:250px 1fr 340px;grid-template-rows:38px 1fr 320px;
  height:100vh;gap:1px;background:var(--border)}
.top{grid-column:1/4;background:#101010;display:flex;align-items:center;gap:10px;padding:0 12px;
  overflow-x:auto;white-space:nowrap}
.top b.logo{font-size:14px}
.pill{background:#2a2a2a;border-radius:10px;padding:2px 9px;font-size:11px;white-space:nowrap}
.pill.warn{background:#4a3a12;color:var(--accent2)}
.pill.bad{background:#4a1414;color:var(--bad)}
.pill.ok{background:#173a22;color:var(--accent)}
.rates{margin-left:auto;font-size:11px;color:var(--dim);white-space:nowrap}

.left{grid-row:2/3;background:var(--panel);display:flex;flex-direction:column;overflow:hidden}
.tabs-v{display:flex;flex-direction:column;border-bottom:1px solid var(--border)}
.tabs-v .tab{padding:9px 12px;border-bottom:1px solid var(--border);color:var(--dim);cursor:pointer;font-size:12px}
.tabs-v .tab.on{background:#262626;color:#fff;font-weight:600;border-left:3px solid var(--accent)}
.tabs-v .tab:hover{background:#202020}
.leftbody{padding:10px;overflow:auto;flex:1}

.scene{grid-column:2/3;grid-row:2/3;background:#20242a;position:relative;overflow:hidden}
.scene iframe{width:100%;height:100%;border:0;background:#20242a}
.scene .badge-tr{position:absolute;right:8px;top:8px;font-size:11px;color:var(--dim)}

.right{grid-column:3/4;grid-row:2/4;background:var(--panel);display:flex;flex-direction:column;overflow:hidden}
.tabs-h{display:flex;border-bottom:1px solid var(--border)}
.tabs-h .tab{flex:1;text-align:center;padding:8px 4px;color:var(--dim);cursor:pointer;font-size:12px}
.tabs-h .tab.on{background:#262626;color:#fff;font-weight:600;border-bottom:2px solid var(--accent)}
.rightbody{padding:10px;overflow:auto;flex:1}

.plots{grid-column:1/3;grid-row:3/4;background:#101010;padding:6px;overflow:auto}
.plots-toolbar{display:flex;align-items:center;gap:10px;padding:2px 4px 6px;font-size:11px;color:var(--dim)}
.plots-toolbar .seg span{cursor:pointer}
.plots-row{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-bottom:5px}
.plot-cell{background:#1b1b1b;border:1px solid var(--border);border-radius:3px;position:relative;cursor:zoom-in;height:118px;overflow:hidden}
.plot-cell .pt{position:absolute;left:4px;top:2px;font-size:10px;color:var(--dim);pointer-events:none;z-index:2}
.plot-cell .u-wrap{width:100%;height:100%}

.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;
  border-bottom:1px dashed var(--border);font-size:12px}
.row label{color:var(--dim)}
.row.tight{padding:2px 0}
.seg{display:inline-flex;border:1px solid var(--border2);border-radius:5px;overflow:hidden}
.seg span{padding:2px 8px;font-size:11px;cursor:pointer;user-select:none}
.seg span.on{background:var(--accent);color:#000}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px}
.small{font-size:11px;color:var(--dim)}
.warnbanner{background:#4a1414;color:#f88;padding:6px 8px;border-radius:4px;font-size:11px;margin-bottom:8px}
.okbanner{background:#173a22;color:var(--accent);padding:6px 8px;border-radius:4px;font-size:11px;margin-bottom:8px}
.hr{border:0;border-top:1px solid var(--border);margin:8px 0}

/* A2 (2026-09-04): ROM/torque violation red panel - a fixed overlay so it never needs its
   own row in the .wrap grid (every other tab's layout stays untouched). */
#violation-badge{background:#5a1414;color:#f88;border:1px solid #a33;animation:violation-pulse 1.4s ease-in-out infinite}
@keyframes violation-pulse{0%,100%{opacity:1}50%{opacity:.55}}
.violation-panel{display:none;position:fixed;top:42px;left:8px;right:8px;max-height:52vh;overflow:auto;
  background:#210d0d;border:1px solid var(--bad);border-radius:6px;padding:10px;z-index:80;
  box-shadow:0 6px 20px #000c}
.violation-panel.on{display:block}
.violation-panel table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:10px}
.violation-panel th{text-align:left;color:var(--dim);padding:3px 6px;border-bottom:1px solid #533}
.violation-panel td{padding:3px 6px;border-bottom:1px dashed #422}
.violation-panel tbody tr[data-joint]:hover{background:#341515;cursor:pointer}

/* Joints tab */
.joint-row{display:grid;grid-template-columns:88px 1fr 62px 52px 20px;align-items:center;gap:6px;padding:3px 0}
.joint-row input[type=range]{width:100%}
.joint-row .num{width:100%}
.joint-row .name{font-size:11px}
.joint-row .phys{font-size:10px;color:var(--dim)}
.tx-cb{transform:scale(.85)}

/* Obs tab */
.obsterm{margin:6px 0}
.obsterm .lbl{font-size:11px;color:var(--dim);display:flex;justify-content:space-between}
.obsbars{display:flex;gap:2px;height:34px;align-items:flex-end;background:#101010;padding:2px;border-radius:3px}
.obsbars i{flex:1;display:block;min-width:2px;background:var(--accent);border-radius:1px 1px 0 0}
.obsbars i.real{background:var(--orangeR)}
.obsbars i.fallback{background:var(--bad)}
#imu3d{width:100%;height:200px;background:#101010;border-radius:4px;margin-top:6px}
.imu-legend{font-size:10px;color:var(--dim);margin-top:2px}

/* Gains tab */
table.gains{width:100%;border-collapse:collapse;font-size:11px}
table.gains th,table.gains td{padding:3px 4px;border-bottom:1px solid var(--border);text-align:right}
table.gains th:first-child,table.gains td:first-child{text-align:left}
table.gains input{width:56px;text-align:right}
.flag{color:var(--bad);font-weight:600}

/* modal */
#modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:50}
#modal.on{display:flex}
#modal .box{background:#181818;border:1px solid var(--border2);border-radius:6px;width:80vw;height:70vh;
  display:flex;flex-direction:column;padding:10px}
#modal .u-wrap{flex:1}
#modal .hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top" id="topbar">
    <b class="logo">pygviewer</b>
    <span class="pill" id="pill-variant">-</span>
    <span class="pill" id="pill-mode">-</span>
    <span class="pill" id="pill-base">-</span>
    <span class="pill" id="pill-control">-</span>
    <span id="topbar-badges"></span>
    <span class="rates" id="topbar-rates"></span>
  </div>
  <div class="violation-panel" id="violation-panel"></div>

  <div class="left">
    <div class="tabs-v" id="left-tabs">
      <div class="tab on" data-tab="model">Model</div>
      <div class="tab" data-tab="base">Base link</div>
      <div class="tab" data-tab="telemetry">Telemetry / Record</div>
      <div class="tab" data-tab="script">Script</div>
      <div class="tab" data-tab="status">Status</div>
    </div>
    <div class="leftbody" id="left-body"></div>
  </div>

  <div class="scene">
    <iframe id="viser-frame" src="about:blank" title="viser 3D scene"></iframe>
    <div class="badge-tr" id="scene-badge"></div>
  </div>

  <div class="right">
    <div class="tabs-h" id="right-tabs">
      <div class="tab on" data-tab="control">Control</div>
      <div class="tab" data-tab="gains">Gains</div>
      <div class="tab" data-tab="obs">Obs</div>
    </div>
    <div class="rightbody" id="right-body"></div>
  </div>

  <div class="plots" id="plots-panel">
    <div class="plots-toolbar" id="plots-toolbar"></div>
    <div id="plots-rows"></div>
  </div>
</div>

<div id="modal"><div class="box">
  <div class="hdr"><b id="modal-title">-</b><button id="modal-close">close</button></div>
  <div class="u-wrap" id="modal-chart"></div>
</div></div>

<script src="/static/vendor/uPlot.iife.min.js"></script>
<script src="/static/vendor/three.min.js"></script>
<script src="/static/dashboard.js"></script>
</body>
</html>

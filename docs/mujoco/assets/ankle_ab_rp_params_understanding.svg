<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
<style>
.t{font-size:13px;fill:#1c1f24}.tb{font-size:14px;font-weight:700;fill:#1c1f24}
.s{font-size:11px;fill:#5a626c}.q{font-size:12px;fill:#c01818;font-weight:700}
.dim{stroke:#2b6fd6;stroke-width:1.2}.rod{stroke:#2b6fd6;stroke-width:3}
.ax{stroke:#c01818;stroke-width:1.2;stroke-dasharray:8 4 2 4}
</style>
<rect width="960" height="700" fill="#fbfcfd"/>
<text x="20" y="28" class="tb" font-size="17">Ankle 2-RSU(A·B) + RP — 파라미터 이해 확인 (측면 개략)</text>
<text x="20" y="47" class="s">사용자 CAD(2026-08-04) 라벨 기반. 빨간 ? = 확인 필요</text>

<!-- shin -->
<rect x="360" y="80" width="90" height="420" fill="#f0e0c0" stroke="#8a7a50" stroke-width="1.5" rx="8"/>
<text x="470" y="100" class="s">정강이(shin)</text>

<!-- actuator A -->
<circle cx="405" cy="170" r="42" fill="#e8c890" stroke="#8a6a30" stroke-width="1.6"/>
<text x="398" y="175" class="tb">A</text>
<circle cx="405" cy="170" r="3" fill="#333"/>
<!-- crank A -->
<line x1="405" y1="170" x2="445" y2="150" stroke="#333" stroke-width="2.4"/>
<circle cx="445" cy="150" r="5" fill="#2b6fd6"/>
<text x="452" y="140" class="t">A_r = 크랭크(혼) 반경</text>

<!-- actuator B -->
<circle cx="405" cy="280" r="36" fill="#b8c4ec" stroke="#3a4a8a" stroke-width="1.6"/>
<text x="399" y="285" class="tb">B</text>
<circle cx="405" cy="280" r="3" fill="#333"/>
<line x1="405" y1="280" x2="440" y2="262" stroke="#333" stroke-width="2.4"/>
<circle cx="440" cy="262" r="5" fill="#2b6fd6"/>
<text x="452" y="258" class="t">B_r</text>

<!-- A2B -->
<line x1="330" y1="170" x2="330" y2="280" class="dim"/>
<line x1="322" y1="170" x2="338" y2="170" class="dim"/><line x1="322" y1="280" x2="338" y2="280" class="dim"/>
<text x="240" y="230" class="t">A2B = A축~B축 거리</text>

<!-- B2RP -->
<line x1="330" y1="280" x2="330" y2="530" class="dim"/>
<line x1="322" y1="530" x2="338" y2="530" class="dim"/>
<text x="212" y="410" class="t">B2RP = B축~RP 중심</text>

<!-- rods -->
<line x1="445" y1="150" x2="490" y2="520" class="rod"/>
<text x="500" y="330" class="t" fill="#2b6fd6">A_L = A 로드 길이</text>
<line x1="440" y1="262" x2="418" y2="535" class="rod"/>
<text x="345" y="480" class="t" fill="#2b6fd6" text-anchor="end">B_L = B 로드 길이</text>

<!-- foot -->
<path d="M330 560 L620 560 L640 590 L320 590 Z" fill="#e8e0d0" stroke="#8a7a50" stroke-width="1.5"/>
<text x="640" y="580" class="s">발(foot)</text>

<!-- RP joint -->
<circle cx="430" cy="530" r="14" fill="#d0b0e0" stroke="#6a3a80" stroke-width="1.6"/>
<circle cx="430" cy="530" r="3" fill="#333"/>
<text x="380" y="518" class="t" text-anchor="end">RP 짐벌 중심</text>

<!-- RP_h -->
<line x1="660" y1="530" x2="660" y2="590" class="dim"/>
<line x1="652" y1="530" x2="668" y2="530" class="dim"/><line x1="652" y1="590" x2="668" y2="590" class="dim"/>
<text x="672" y="562" class="t">RP_h = RP 중심 높이 <tspan class="q">?기준: 발바닥?</tspan></text>
<line x1="430" y1="530" x2="652" y2="530" stroke="#bbb" stroke-width="0.8" stroke-dasharray="3 3"/>

<!-- rod anchors on foot -->
<circle cx="490" cy="520" r="5" fill="#2b6fd6"/>
<circle cx="418" cy="535" r="5" fill="#2b6fd6"/>
<text x="500" y="512" class="t">RP_B_R = RP→우측 로드 앵커</text>
<text x="240" y="548" class="t">RP_B_L = RP→좌측 로드 앵커</text>
<line x1="430" y1="530" x2="490" y2="520" stroke="#6a3a80" stroke-width="1.4"/>
<line x1="430" y1="530" x2="418" y2="535" stroke="#6a3a80" stroke-width="1.4"/>

<!-- RP_r -->
<text x="430" y="620" class="t">RP_r = <tspan class="q">? RP 중심→앵커의 유효 팔(롤/피치 팔) 인가, 짐벌 자체 치수인가</tspan></text>

<!-- A_h = B_h -->
<line x1="405" y1="115" x2="405" y2="90" class="ax"/>
<text x="415" y="95" class="t">A_h = B_h <tspan class="q">? 혼 볼조인트의 횡(모터축 방향) 오프셋이 두 모터 동일하다는 제약?</tspan></text>

<!-- notes -->
<rect x="640" y="90" width="305" height="330" fill="#fff8f0" stroke="#c09040" rx="6"/>
<text x="655" y="112" class="tb">내가 이해한 구조</text>
<text x="655" y="136" class="t">• A(상)·B(하) 두 액추에이터가 정강이에</text>
<text x="655" y="154" class="t">  직렬 스택, 각자 크랭크(A_r/B_r) 회전</text>
<text x="655" y="172" class="t">• 크랭크 끝 볼조인트 → 로드(A_L/B_L)</text>
<text x="655" y="190" class="t">  → 발의 앵커(RP_B_R/RP_B_L)</text>
<text x="655" y="208" class="t">• RP 짐벌이 발-정강이 2자유도 연결,</text>
<text x="655" y="226" class="t">  두 로드가 pitch(공통)+roll(차동) 구동</text>
<text x="655" y="244" class="t">• 세로 스택: A2B + B2RP + RP_h 가</text>
<text x="655" y="262" class="t">  정강이 길이 예산을 정의</text>
<text x="655" y="286" class="s">구모델 값(2-RSU 툴, §8c): 크랭크 r_c 30 /</text>
<text x="655" y="302" class="s">피치 팔 a_p 60 / 롤 팔 a_r 40 mm — 이 CAD가</text>
<text x="655" y="318" class="s">그 값을 승계하는지 확인 필요</text>
<text x="655" y="346" class="q">Q1. A·B 모터 기종? (둘 다 RS03?)</text>
<text x="655" y="368" class="q">Q2. RP_B_R/L 은 스칼라 거리? 3성분 벡터?</text>
<text x="655" y="390" class="q">Q3. 로드엔드 = §8d JET8+MSB8 유지?</text>
<text x="655" y="412" class="q">Q4. 로드 배치가 RP 기준 좌우대칭?</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
<style>
  .t{font-size:13px;fill:#1c1f24}.tb{font-size:14px;font-weight:700;fill:#1c1f24}
  .s{font-size:11px;fill:#5a626c}.q{font-size:12px;fill:#c01818;font-weight:700}
  .ax{stroke:#c01818;stroke-width:1.4;stroke-dasharray:9 4 2 4}
  .dim{stroke:#2b6fd6;stroke-width:1}.lead{stroke:#8a929c;stroke-width:1}
</style>
<rect width="980" height="720" fill="#fbfcfd"/>
<text x="20" y="28" class="tb" font-size="17">Hip_Yaw 체결 구조 — 내가 이해한 내용 (확인 요청)</text>
<text x="20" y="48" class="s">사용자 CAD 스크린샷(2026-08-04) 기반. ? 표시 = 확인 필요 항목</text>

<!-- ================= 좌: 전체 계통 ================= -->
<text x="40" y="82" class="tb">① 관절 계통 (위 → 아래)</text>
<line x1="205" y1="95" x2="205" y2="640" class="ax"/>

<!-- Hip pitch -->
<rect x="255" y="100" width="120" height="52" fill="#f5e3b8" stroke="#7a6a3a"/>
<text x="385" y="122" class="t">Hip_Pitch (RS04)</text>
<text x="385" y="139" class="s">골반 체결부 → §8j FEA 하중케이스</text>

<!-- Hip roll -->
<circle cx="205" cy="205" r="46" fill="#f0b8ae" stroke="#8a4a40" stroke-width="1.5"/>
<circle cx="205" cy="205" r="16" fill="#fff" stroke="#8a4a40"/>
<text x="270" y="200" class="t">Hip_Roll (RS04)</text>
<text x="270" y="217" class="s">6T 알루미늄 포크 양단지지, 갭 60 mm</text>

<!-- Hip yaw actuator -->
<rect x="150" y="278" width="110" height="62" fill="#d9cf9a" stroke="#6a6033" stroke-width="1.5"/>
<text x="278" y="298" class="t">Hip_Yaw (RS03)</text>
<text x="278" y="315" class="s">회전축 = 그림의 세로 일점쇄선</text>

<!-- gap -->
<line x1="150" y1="348" x2="260" y2="348" class="dim"/>
<line x1="150" y1="340" x2="150" y2="356" class="dim"/>
<line x1="260" y1="340" x2="260" y2="356" class="dim"/>
<text x="278" y="352" class="q">유격 3~5 mm + 알루미늄 브라켓</text>

<!-- external bearing (green) -->
<rect x="140" y="356" width="130" height="18" fill="#8fd48f" stroke="#2f6b2f" stroke-width="1.5"/>
<text x="288" y="370" class="t">외부 베어링 (깊은홈, ID ≥ 80)</text>

<!-- thigh link = hip_yaw ~ knee link -->
<rect x="152" y="380" width="16" height="200" fill="#bcd4f5" stroke="#2b6fd6" stroke-width="1.6"/>
<rect x="242" y="380" width="16" height="200" fill="#bcd4f5" stroke="#2b6fd6" stroke-width="1.6"/>
<line x1="152" y1="380" x2="258" y2="380" stroke="#2b6fd6" stroke-width="1.6"/>
<text x="288" y="452" class="t">Hip_Yaw → Knee 링크 (2레일)</text>
<text x="288" y="469" class="s">= 시뮬레이션의 <tspan font-weight="700">thigh_link</tspan></text>
<text x="288" y="486" class="s">→ §8l의 hip_yaw 하중이 곧 이 링크가</text>
<text x="288" y="503" class="s">   베어링으로 전달하는 하중</text>

<!-- knee -->
<rect x="168" y="560" width="74" height="52" fill="#d6b8e8" stroke="#6a3a80" stroke-width="1.5"/>
<text x="262" y="580" class="t">Knee (RS04)</text>
<text x="262" y="597" class="q">? 2레일이 무릎을 양단지지 하나</text>
<text x="262" y="613" class="q">? 레일 간격 = knee span (가정 60 mm)</text>

<!-- ================= 우: 베어링 상세 ================= -->
<text x="600" y="82" class="tb">② hip_yaw 베어링 축방향 배치 (§8l 가정)</text>
<line x1="640" y1="100" x2="640" y2="420" class="ax"/>

<!-- motor body -->
<rect x="655" y="150" width="150" height="120" fill="#d9cf9a" stroke="#6a6033" stroke-width="1.5"/>
<text x="815" y="200" class="s">RS03 하우징</text>

<!-- internal bearings -->
<rect x="668" y="152" width="60" height="14" fill="#c8c8d8" stroke="#4a4a66"/>
<text x="740" y="163" class="s">61810 #1 — 중심 3.5 mm</text>
<rect x="668" y="186" width="60" height="14" fill="#c8c8d8" stroke="#4a4a66"/>
<text x="740" y="197" class="s" font-weight="700">61810 #2 — 중심 20.5 mm  ← 커플 짝</text>
<rect x="676" y="216" width="34" height="10" fill="#c8c8d8" stroke="#4a4a66"/>
<text x="740" y="225" class="s">소형 로터 베어링 (C0 작아 분담 불가)</text>

<!-- flange face -->
<line x1="640" y1="150" x2="900" y2="150" stroke="#c01818" stroke-width="1" stroke-dasharray="4 3"/>
<text x="905" y="147" class="s">플랜지면 0</text>

<!-- gap + external -->
<line x1="655" y1="150" x2="655" y2="128" class="dim"/>
<rect x="648" y="118" width="120" height="16" fill="#8fd48f" stroke="#2f6b2f" stroke-width="1.5"/>
<text x="778" y="130" class="s" font-weight="700">외부 베어링 중심 = −(갭 + 폭/2)</text>

<!-- span dimension -->
<line x1="620" y1="126" x2="620" y2="193" class="dim"/>
<line x1="612" y1="126" x2="628" y2="126" class="dim"/>
<line x1="612" y1="193" x2="628" y2="193" class="dim"/>
<text x="500" y="163" class="tb" fill="#2b6fd6">커플 span</text>
<text x="500" y="180" class="s">= 이 치수가 유일한 설계 레버</text>
<text x="500" y="197" class="s">29~34 mm (후보별)</text>

<!-- load path -->
<text x="600" y="300" class="tb">③ 하중 전달 경로 (내가 이해한 것)</text>
<text x="600" y="322" class="t">지면 → 발 → 정강이 → Knee → <tspan font-weight="700">2레일 링크</tspan></text>
<text x="600" y="342" class="t">→ 외부 베어링 <tspan font-weight="700">+</tspan> RS03 내부 61810 쌍 (커플로 분담)</text>
<text x="600" y="362" class="t">→ 알루미늄 브라켓 → Hip_Roll 출력 → 골반</text>
<text x="600" y="386" class="s">전도모멘트 M⊥ P99 86.5 N·m 를 외부 베어링과 61810#2 가</text>
<text x="600" y="403" class="s">span 만큼 떨어져서 커플로 받는다 → 반력 P99 2800~3500 N</text>

<!-- questions box -->
<rect x="595" y="430" width="360" height="212" fill="#fff4f4" stroke="#c01818" stroke-width="1.2" rx="6"/>
<text x="610" y="452" class="q" font-size="13">확인이 필요한 것</text>
<text x="610" y="476" class="t">Q1. 알루미늄 브라켓은 <tspan font-weight="700">고정측</tspan>(Hip_Roll 출력)에</text>
<text x="628" y="493" class="t">붙나, <tspan font-weight="700">회전측</tspan>(2레일 링크)에 붙나?</text>
<text x="610" y="516" class="t">Q2. 유격 3~5 mm 는 모터 표면 ↔ 베어링 <tspan font-weight="700">면</tspan>?</text>
<text x="628" y="533" class="t">브라켓 두께 포함인가 별도인가?</text>
<text x="610" y="556" class="t">Q3. 61810 #2 실제 깊이가 20.5 mm 맞나?</text>
<text x="610" y="579" class="t">Q4. 2레일이 무릎을 양단지지? 레일 간격은?</text>
<text x="610" y="602" class="t">Q5. 링크 길이(yaw축 ~ knee축)와 레일 단면?</text>
<text x="610" y="625" class="t">Q6. 베어링 외경 상한 — 100 이상 허용되나?</text>
</svg>
